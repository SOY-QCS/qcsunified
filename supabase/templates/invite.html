<div style="font-family:Arial,sans-serif;max-width:520px;margin:auto;padding:24px;color:#1a1a1a">
  <div style="background:#df6518;color:#fff;font-weight:bold;padding:14px 18px;border-radius:10px 10px 0 0">QCS Ghana · Operations</div>
  <div style="border:1px solid #e6e1da;border-top:0;padding:20px;border-radius:0 0 10px 10px">
    <p>Hello {{ .Data.full_name }},</p>
    <p>You've been invited to the QCS Operations dashboard. Click below to choose your password.</p>
    <p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=invite&next=/reset-password"
          style="background:#df6518;color:#fff;padding:12px 18px;border-radius:8px;text-decoration:none;display:inline-block">Set my password</a></p>
    <p style="color:#6b6b6b;font-size:13px">This link expires in 24 hours. If you weren't expecting this, ignore this email.</p>
  </div>
</div>
